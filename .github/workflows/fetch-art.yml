# One-off: fetch an open-access museum image (the dev sandbox can't reach
# museum sites) and commit it to the branch. Removed once the file is in.
name: Fetch artwork

on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/fetch-art.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Jan Davidsz de Heem, Vase of Flowers, c. 1660 (NGA 1961.6.1, open access)
        run: |
          mkdir -p art
          curl -fsSL --retry 4 -o art/de-heem-vase-of-flowers-nga-1961-6-1.jpg \
            'https://api.nga.gov/iiif/bfc54c5f-a5ea-4aca-9e8e-e2ff169c48b5/full/!3000,3000/0/default.jpg'
          file art/*.jpg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art
          git commit -m "Add de Heem, Vase of Flowers (National Gallery of Art, open access)"
          git push

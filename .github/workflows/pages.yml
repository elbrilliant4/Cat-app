# Publishes the site to GitHub Pages:
#   /                 the app from main (what everyone sees)
#   /preview/         the work-in-progress branch, for review before it goes live
#   /preview/review/  a review pack rendered from that preview build (close-ups,
#                     eyes, clips, room views, sounds), made by the branch's
#                     tools/review-pack/run.sh
# Each build gets a version.json (build number = commits on its branch, plus
# the commit), which the app shows as its build label.
# Runs on every push to main, and on demand (a push to the review branch
# triggers it through preview.yml).
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PREVIEW_BRANCH: claude/expressive-cat-modern-ui-65z6r5

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
      - name: Fetch the review branch
        id: preview
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PREVIEW_BRANCH }}
          path: preview-src
          fetch-depth: 0
      - name: Stamp build numbers
        run: |
          stamp() {
            printf '{"build": %s, "commit": "%s", "channel": "%s", "date": "%s"}\n' \
              "$(git -C "$1" rev-list --count HEAD)" "$(git -C "$1" rev-parse --short HEAD)" "$2" "$(date -u +%FT%TZ)" > "$1/dist/version.json"
          }
          stamp . live
          if [ -d preview-src/dist ]; then stamp preview-src preview; fi
      - name: Render the preview's review pack
        if: steps.preview.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 50
        run: |
          if [ -x preview-src/tools/review-pack/run.sh ]; then
            preview-src/tools/review-pack/run.sh preview-src/dist
          fi
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r dist/. _site/
          if [ -d preview-src/dist ]; then
            mkdir -p _site/preview
            cp -r preview-src/dist/. _site/preview/
          fi
          # Short links for reviewers: /review/ opens the latest preview's
          # review pack.
          mkdir -p _site/review
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>Mochi review pack</title>' \
            '<meta http-equiv="refresh" content="0; url=../preview/review/">' \
            '<p>Opening the latest review pack: <a href="../preview/review/">preview/review/</a></p>' > _site/review/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
